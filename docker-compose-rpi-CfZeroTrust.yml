# ==============================================================================
# Open Quiz Platform - Raspberry Pi Cluster + Cloudflare Zero Trust
# ==============================================================================
#
# Comment: This docker-compose file is designed to deploy the Open Quiz Platform
# on a Raspberry Pi cluster that I have at home with Cloudflare Zero Trust for 
# secure access without port forwarding (no need to open any port in my home 
# router).
#
# Designed for:
#   - 3 x Raspberry Pi 4 (1x 8GB Storage/Manager, 2x 4GB Compute/Managers)
#   - 2-3 x Raspberry Pi 3 (1GB RAM Workers for Pupil Frontend)
#   - Public domain: openquiz.yaluba.org (Zero Port-Forwarding via Cloudflare)
#
# Cluster Node Labels Setup (run on Swarm Manager):
#   docker node update --label-add storage=true <rpi4-8gb-hostname>
#   docker node update --label-add tier=heavy <rpi4-8gb-hostname>
#   docker node update --label-add tier=heavy <rpi4-4gb-1-hostname>
#   docker node update --label-add tier=heavy <rpi4-4gb-2-hostname>
#   docker node update --label-add tier=light <rpi3-hostname-1>
#   docker node update --label-add tier=light <rpi3-hostname-2>
#
# Usage:
#   1. Set CLOUDFLARE_TUNNEL_TOKEN and DOMAIN in .env
#   2. Ensure secrets exist in ./secrets/
#   3. Deploy or run scripts/deploy-rpi.sh (handles building, pushing to local swarm registry, and deploying with .env exported)
#      Or manually:
#        docker service create --name registry --publish published=5000,target=5000 registry:2 (if not running)
#        docker compose build
#        docker tag quiz-backend:latest 127.0.0.1:5000/quiz-backend:latest && docker push 127.0.0.1:5000/quiz-backend:latest
#        docker tag quiz-frontend-professor:latest 127.0.0.1:5000/quiz-frontend-professor:latest && docker push 127.0.0.1:5000/quiz-frontend-professor:latest
#        docker tag quiz-frontend-pupil:latest 127.0.0.1:5000/quiz-frontend-pupil:latest && docker push 127.0.0.1:5000/quiz-frontend-pupil:latest
#        set -a; source .env; set +a; docker stack deploy -c docker-compose-rpi-CfZeroTrust.yml quiz
# ==============================================================================

# ------------------------------------------------------------------------------
# Secrets (Encrypted at rest in Swarm, mounted into /run/secrets/)
# ------------------------------------------------------------------------------
secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_host:
    file: ./secrets/smtp_host.txt
  smtp_port:
    file: ./secrets/smtp_port.txt
  smtp_user:
    file: ./secrets/smtp_user.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  smtp_from:
    file: ./secrets/smtp_from.txt
  garage_rpc_secret:
    file: ./secrets/garage_rpc_secret.txt
  garage_admin_token:
    file: ./secrets/garage_admin_token.txt
  garage_s3_key_id:
    file: ./secrets/garage_s3_key_id.txt
  garage_s3_secret_key:
    file: ./secrets/garage_s3_secret_key.txt

# ------------------------------------------------------------------------------
# Networks (Overlay networks for multi-node encryption and service isolation)
# ------------------------------------------------------------------------------
networks:
  # Public ingress network: Traefik, Cloudflared tunnel, and exposed web/API services
  quiz_public:
    external: true

  # Internal back-tier network: isolated, encrypted, strictly unexposed
  quiz_internal:
    external: true

# ------------------------------------------------------------------------------
# Persistent Volumes (Pinned to RPi 4 with USB SSD via node.labels.storage == true)
# ------------------------------------------------------------------------------
volumes:
  traefik_acme:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local

# ------------------------------------------------------------------------------
# Services
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Gateway (Traefik v3)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:latest
    command:
      - "--configfile=/etc/traefik/traefik.yml"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
    ports:
      # Optional local LAN access (no router port-forwarding required)
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/etc/traefik/acme
    networks:
      - quiz_public
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager
          - node.labels.storage == true
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Cloudflare Zero Trust Ingress Tunnel (cloudflared)
  # Connects outbound to Cloudflare edge; exposes openquiz.yaluba.org without open ports.
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - quiz_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.tier == heavy
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ----------------------------------------------------------------------------
  # 3. Pupil Frontend (Mobile-First Web App)
  # Unconstrained tier: schedules across RPi 3 workers and RPi 4 nodes.
  # ----------------------------------------------------------------------------
  frontend_pupil:
    image: ${REGISTRY_PREFIX:-127.0.0.1:5000/}quiz-frontend-pupil:latest
    build:
      context: ./frontends/pupil
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-/}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-openquiz.yaluba.org}/api
      - NEXT_PUBLIC_WS_URL=https://${DOMAIN:-openquiz.yaluba.org}
    networks:
      - quiz_public
    deploy:
      mode: replicated
      replicas: 3
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=quiz_public"
        - "traefik.http.routers.pupil.rule=Host(`${DOMAIN:-openquiz.yaluba.org}`) || Host(`localhost`) || Host(`127.0.0.1`)"
        - "traefik.http.routers.pupil.entrypoints=websecure"
        - "traefik.http.routers.pupil.priority=10"
        - "traefik.http.routers.pupil.tls=true"
        - "traefik.http.routers.pupil.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pupil.middlewares=security-headers@file,compress@file"
        - "traefik.http.services.pupil.loadbalancer.server.port=3000"
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M
      restart_policy:
        condition: on-failure

  # ----------------------------------------------------------------------------
  # 4. Professor Frontend (Dashboard, Quiz Studio & Classroom Projector)
  # Pinned to RPi 4 (tier == heavy) for fast SSR and dashboard compilation.
  # ----------------------------------------------------------------------------
  frontend_professor:
    image: ${REGISTRY_PREFIX:-127.0.0.1:5000/}quiz-frontend-professor:latest
    build:
      context: ./frontends/professor
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-/}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-openquiz.yaluba.org}/api
      - NEXT_PUBLIC_WS_URL=https://${DOMAIN:-openquiz.yaluba.org}
    networks:
      - quiz_public
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.tier == heavy
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=quiz_public"
        - "traefik.http.routers.professor.rule=(Host(`${DOMAIN:-openquiz.yaluba.org}`) || Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/teacher`)"
        - "traefik.http.routers.professor.entrypoints=websecure"
        - "traefik.http.routers.professor.priority=20"
        - "traefik.http.routers.professor.tls=true"
        - "traefik.http.routers.professor.tls.certresolver=letsencrypt"
        - "traefik.http.routers.professor.middlewares=security-headers@file,compress@file"
        - "traefik.http.services.professor.loadbalancer.server.port=3000"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure

  # ----------------------------------------------------------------------------
  # 5. Backend API & WebSocket Game Engine (Fastify + Socket.io)
  # Pinned to RPi 4 (tier == heavy) for high CPU burst scoring & low latency.
  # ----------------------------------------------------------------------------
  backend:
    image: ${REGISTRY_PREFIX:-127.0.0.1:5000/}quiz-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    secrets:
      - db_user
      - db_password
      - redis_password
      - jwt_secret
      - smtp_host
      - smtp_port
      - smtp_user
      - smtp_password
      - smtp_from
      - garage_s3_key_id
      - garage_s3_secret_key
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-quiz_db}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SMTP_HOST_FILE=/run/secrets/smtp_host
      - SMTP_PORT_FILE=/run/secrets/smtp_port
      - SMTP_USER_FILE=/run/secrets/smtp_user
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SMTP_FROM_FILE=/run/secrets/smtp_from
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_BUCKET=${S3_BUCKET:-media}
      - S3_REGION=${S3_REGION:-garage}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-/media}
      - S3_ACCESS_KEY_FILE=/run/secrets/garage_s3_key_id
      - S3_SECRET_KEY_FILE=/run/secrets/garage_s3_secret_key
      - APP_URL=https://${DOMAIN:-openquiz.yaluba.org}
    networks:
      - quiz_public
      - quiz_internal
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.tier == heavy
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=quiz_public"
        - "traefik.http.routers.backend.rule=((Host(`${DOMAIN:-openquiz.yaluba.org}`) || Host(`localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))) || (Host(`${API_SUBDOMAIN:-api.openquiz.yaluba.org}`) && !Host(`${DOMAIN:-openquiz.yaluba.org}`) && !Host(`localhost`) && !Host(`127.0.0.1`))"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.priority=30"
        - "traefik.http.routers.backend.tls=true"
        - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
        - "traefik.http.routers.backend.middlewares=security-headers@file,rate-limit-general@file"
        - "traefik.http.services.backend.loadbalancer.server.port=4000"
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 192M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 6. Persistent Relational Database (PostgreSQL 16)
  # Pinned to primary storage host (RPi 4 8GB + USB SSD) via node.labels.storage == true.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    secrets:
      - db_user
      - db_password
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-quiz_db}
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - quiz_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB:-quiz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 7. In-Memory State & Pub/Sub Store (Redis 7)
  # Pinned to primary storage host (RPi 4 8GB) to guarantee volume persistence.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    secrets:
      - redis_password
    command: >
      sh -c '
        exec redis-server
        --requirepass "$$(cat /run/secrets/redis_password)"
        --appendonly yes
        --maxmemory 384mb
        --maxmemory-policy allkeys-lru
      '
    volumes:
      - redis_data:/data
    networks:
      - quiz_internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 96M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 8. S3-Compatible Object Storage (Garage S3 - ~25MB RAM Footprint)
  # Pinned to primary storage host (RPi 4 8GB + USB SSD).
  # ----------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    environment:
      - GARAGE_DEFAULT_BUCKET=media
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_S3_KEY_ID:-GKopenquizkey01}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_S3_SECRET_KEY:-default_dev_secret_key_2026!}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - quiz_internal
      - quiz_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=quiz_public"
        - "traefik.http.routers.garage.rule=(Host(`${DOMAIN:-openquiz.yaluba.org}`) || Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/media`)"
        - "traefik.http.routers.garage.entrypoints=websecure"
        - "traefik.http.routers.garage.priority=25"
        - "traefik.http.routers.garage.tls=true"
        - "traefik.http.routers.garage.tls.certresolver=letsencrypt"
        - "traefik.http.routers.garage.middlewares=garage-strip,garage-host,security-headers@file,compress@file"
        - "traefik.http.middlewares.garage-strip.stripprefix.prefixes=/media"
        - "traefik.http.middlewares.garage-host.headers.customrequestheaders.Host=media"
        - "traefik.http.services.garage.loadbalancer.server.port=3902"
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 9. Garage S3 Bucket Initialization
  # ----------------------------------------------------------------------------
  garage_init:
    image: alpine:3.20
    depends_on:
      - garage
    secrets:
      - garage_admin_token
    volumes:
      - ./garage/init-garage.sh:/init-garage.sh:ro
    networks:
      - quiz_internal
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache curl jq >/dev/null 2>&1 &&
        /bin/sh /init-garage.sh
      "
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.storage == true
      restart_policy:
        condition: on-failure
        max_attempts: 5

